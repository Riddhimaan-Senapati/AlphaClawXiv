name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Validate release version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./plugins/alphaclawxiv/package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./plugins/alphaclawxiv/openclaw.plugin.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match openclaw.plugin.json version ($PLUGIN_VERSION)"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag ($GITHUB_REF_NAME) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci
        working-directory: ./plugins/alphaclawxiv

      - name: Build package and typecheck
        run: |
          npm run build
          npm run typecheck
        working-directory: ./plugins/alphaclawxiv

      - name: Validate built runtime syntax
        shell: bash
        run: |
          for file in $(find ./plugins/alphaclawxiv/dist -name '*.js'); do
            node --check "$file"
          done

      - name: Verify npm package contents
        run: npm pack --dry-run
        working-directory: ./plugins/alphaclawxiv

      - name: Build ClawPack artifact
        shell: bash
        working-directory: ./plugins/alphaclawxiv
        run: |
          PACK_JSON="$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          CLAWPACK_FILENAME="$(node -e 'const fs = require("fs"); const data = fs.readFileSync(0, "utf8"); console.log(JSON.parse(data)[0].filename);' <<< "$PACK_JSON")"
          echo "CLAWPACK_PATH=$RUNNER_TEMP/$CLAWPACK_FILENAME" >> "$GITHUB_ENV"
          echo "$PACK_JSON"

      - name: Dry-run ClawHub ClawPack publish
        shell: bash
        run: |
          npx -y clawhub@0.17.0 package publish "$CLAWPACK_PATH" \
            --family code-plugin \
            --version "$PACKAGE_VERSION" \
            --changelog "Release $PACKAGE_VERSION" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --source-ref "$GITHUB_REF_NAME" \
            --source-path plugins/alphaclawxiv \
            --dry-run

      - name: Publish to npm
        run: npm publish ./plugins/alphaclawxiv --provenance

      - name: Publish to ClawHub
        shell: bash
        working-directory: ./plugins/alphaclawxiv
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CHANGELOG: ${{ github.event.release.body || github.event.release.name || github.event.release.tag_name }}
        run: |
          npx -y clawhub@0.17.0 login --token "$CLAWHUB_TOKEN" --no-browser
          npx -y clawhub@0.17.0 package publish "$CLAWPACK_PATH" \
            --family code-plugin \
            --version "$PACKAGE_VERSION" \
            --changelog "$CHANGELOG" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --source-ref "$GITHUB_REF_NAME" \
            --source-path plugins/alphaclawxiv
